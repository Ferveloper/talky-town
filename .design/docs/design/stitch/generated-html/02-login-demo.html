<div class="absolute top-1/4 right-1/4 w-16 h-16 bg-tertiary-container rounded-full opacity-60 blur-lg mix-blend-multiply"></div>
<!-- Main Card -->

<!-- Avatar/Mascot -->
<div class="w-32 h-32 -mt-20 mb-stack-sm rounded-full overflow-hidden border-4 border-surface-container-lowest shadow-[0_4px_12px_rgba(0,0,0,0.1)] relative bg-surface">
<img alt="Friendly waving 3D owl mascot for TalkyTown" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ADBb0uiKkS7Nai543W0hjfTo4szF9Y-THyBtO2-wAudI2w7SXyIYUuIZUtTY3nOhnUabpqoFYy9kaJfQIR9mtEvh65B6VHcBGteZdB4A6yFBImG3H-D2ucFtSGdr4W6svEmaTP-zKusWaBk1M2dI-_9rj_zUGxwkfxQsXFgaMfb2ulK1PuTN2j30yM5lmqfeCVX4Mh3TDjZjoUjzn6Y58AWHGh822skg6adU6O3iK39rfG_xL2nxu2zKD_VzmSY"/>
</div>
<!-- Title -->
<h1 class="font-display-lg text-display-lg text-primary text-center mb-stack-md">
            Entrar en TalkyTown
        </h1>
<!-- Form -->
<form class="w-full flex flex-col gap-stack-sm w-full">
<!-- Email Input -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="w-full h-14 pl-12 pr-4 bg-surface rounded-full border-2 border-surface-container-highest text-on-surface focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary-container transition-all font-body-md placeholder-on-surface-variant" id="email" placeholder="Email" type="email"/>
</div>
<!-- Password Input -->
<div class="relative mb-stack-sm">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="w-full h-14 pl-12 pr-4 bg-surface rounded-full border-2 border-surface-container-highest text-on-surface focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary-container transition-all font-body-md placeholder-on-surface-variant" id="password" placeholder="Contraseña" type="password"/>
</div>
<!-- Primary Action -->
<button class="w-full h-14 bg-inverse-primary text-on-primary-fixed-variant font-label-bold text-label-bold rounded-full shadow-[0_4px_0_0_#004c69] btn-press transition-transform hover:bg-primary-container uppercase tracking-wider mb-stack-sm" type="button">
                Entrar
            </button>
<!-- Divider -->
<div class="flex items-center justify-center my-2 gap-4">
<div class="h-0.5 bg-surface-container-highest flex-1 rounded-full"></div>
<span class="text-on-surface-variant font-caption text-caption uppercase">O</span>
<div class="h-0.5 bg-surface-container-highest flex-1 rounded-full"></div>
</div>
<!-- Secondary Action (Demo Mode) -->
<button class="w-full h-14 bg-secondary-container text-on-secondary-container font-label-bold text-label-bold rounded-full shadow-[0_4px_0_0_#725b00] btn-press transition-transform hover:bg-secondary-fixed-dim uppercase tracking-wider flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined">play_circle</span>
                Usar modo demo
            </button>
<!-- Helper Text -->
<p class="text-center text-on-surface-variant font-caption text-caption mt-2 px-4">
                El modo demo permite probar la aplicación sin configurar claves de IA.
            </p>
</form>
<!-- Footer Link -->
<div class="mt-stack-lg border-t-2 border-surface-container-highest w-full pt-stack-sm text-center">
