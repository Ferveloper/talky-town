<style>
        /* Custom Skeuomorphic Button Press Animation */
        .btn-press {
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-press:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 0 currentColor !important;
        }
        
        .card-press {
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-press:hover {
            transform: translateY(-2px);
        }
        .card-press:active {
            transform: translateY(4px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05) !important;
        }

        /* Ambient cloud pattern for background */
        .bg-clouds {

                              radial-gradient(circle at 80% 60%, rgba(255, 255, 255, 0.5) 0%, transparent 25%),
                              radial-gradient(circle at 50% 90%, rgba(255, 255, 255, 0.4) 0%, transparent 30%);
