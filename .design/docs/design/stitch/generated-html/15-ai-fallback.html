<style>

        .btn-bounce:active {
            transform: scale(0.95) translateY(4px);

        }

            animation: float 4s ease-in-out infinite;

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center justify-center relative overflow-hidden">

                Luna necesita un segundo. Podemos seguir jugando en modo demo.

                ¡Las lechuzas también necesitan pensar a veces!
            </p>
</div>

<span class="material-symbols-outlined text-3xl" data-icon="refresh" data-weight="fill">refresh</span>

            </p>

<script>
        // Simple script to handle button clicks for demonstration
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                // Add a small vibration if supported
                if (navigator.vibrate) {
                    navigator.vibrate(50);
                }
                
                // Show a brief visual feedback
                const originalText = this.innerHTML;
                const icon = this.querySelector('.material-symbols-outlined');
                
                if(icon && icon.textContent === 'refresh') {
                     icon.classList.add('animate-spin');
                     setTimeout(() => {
                         icon.classList.remove('animate-spin');
                     }, 1000);
                }
            });
        });
    </script>
