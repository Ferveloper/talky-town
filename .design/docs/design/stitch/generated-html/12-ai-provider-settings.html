<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Configuración de IA - TalkyTown</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#fff9f0",
                        "on-tertiary-fixed": "#002107",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f9f3ea",
                        "secondary-container": "#fdd34d",
                        "on-tertiary-fixed-variant": "#07521d",
                        "on-primary": "#ffffff",
                        "on-background": "#1d1b16",
                        "tertiary": "#286b33",
                        "tertiary-fixed": "#abf4ac",
                        "inverse-primary": "#7ad0ff",
                        "on-surface-variant": "#3e484f",
                        "outline": "#6e7980",
                        "on-secondary-fixed-variant": "#574500",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e7e2d9",
                        "surface-container-high": "#ede7df",
                        "on-secondary-fixed": "#241a00",
                        "background": "#fff9f0",
                        "primary-fixed-dim": "#7ad0ff",
                        "outline-variant": "#bdc8d1",
                        "surface-tint": "#00668a",
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#725b00",
                        "tertiary-container": "#82c885",
                        "surface-container": "#f3ede4",
                        "surface-variant": "#e7e2d9",
                        "secondary-fixed": "#ffe087",
                        "on-primary-fixed-variant": "#004c69",
                        "surface-container-lowest": "#ffffff",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#32302a",
                        "inverse-on-surface": "#f6f0e7",
                        "surface-dim": "#dfd9d1",
                        "on-surface": "#1d1b16",
                        "secondary-fixed-dim": "#ebc23e",
                        "tertiary-fixed-dim": "#90d792",
                        "on-primary-container": "#004e6b",
                        "primary-container": "#40c4ff",
                        "on-error": "#ffffff",
                        "primary-fixed": "#c3e8ff",
                        "primary": "#00668a",
                        "error": "#ba1a1a",
                        "surface": "#fff9f0",
                        "secondary": "#735c00",
                        "on-tertiary-container": "#0a541f",
                        "on-primary-fixed": "#001e2c"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "24px",
                        "stack-lg": "48px",
                        "stack-sm": "12px",
                        "container-margin": "24px",
                        "unit": "8px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "label-bold": ["Quicksand"],
                        "headline-md": ["Quicksand"],
                        "display-lg-mobile": ["Quicksand"],
                        "display-lg": ["Quicksand"],
                        "body-md": ["Quicksand"],
                        "body-lg": ["Quicksand"],
                        "caption": ["Quicksand"]
                    },
                    "fontSize": {
                        "label-bold": ["16px", { "lineHeight": "24px", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "38px", "fontWeight": "700" }],
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["18px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "body-lg": ["20px", { "lineHeight": "30px", "fontWeight": "500" }],
                        "caption": ["14px", { "lineHeight": "20px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen">
<!-- Top Navigation App Bar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-margin h-20 bg-surface border-b-4 border-surface-container-highest shadow-sm">
<div class="flex items-center gap-4">
<a class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-2 rounded-full hover:bg-surface-container-high" href="#">
<span class="material-symbols-outlined text-[28px]" data-icon="arrow_back" data-weight="fill">arrow_back</span>
</a>
<span class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">TalkyTown</span>
</div>
<div class="flex items-center gap-4 text-primary">
<button class="hover:scale-105 active:translate-y-1 transition-all duration-100 p-2 rounded-full hover:bg-surface-container-high text-on-surface-variant">
<span class="material-symbols-outlined text-[28px]" data-icon="star" data-weight="fill">star</span>
</button>
<button class="hover:scale-105 active:translate-y-1 transition-all duration-100 p-2 rounded-full hover:bg-surface-container-high text-on-surface-variant">
<span class="material-symbols-outlined text-[28px]" data-icon="local_fire_department" data-weight="fill">local_fire_department</span>
</button>
<div class="w-10 h-10 rounded-full bg-primary-container overflow-hidden border-2 border-primary flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container text-[24px]">person</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 pb-stack-lg px-container-margin max-w-4xl mx-auto space-y-stack-md">
<!-- Header Section -->
<div class="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b-2 border-surface-container-highest pb-4">
<div>
<a class="inline-flex items-center gap-2 text-primary font-label-bold text-label-bold mb-2 hover:underline" href="#">
<span class="material-symbols-outlined text-[20px]">keyboard_return</span>
                    Volver al Dashboard
                </a>
<h1 class="font-display-lg text-display-lg text-on-surface">Configuración de IA</h1>
</div>
<!-- Connection Status Badge -->
<div class="inline-flex items-center gap-2 bg-tertiary-container px-4 py-2 rounded-full border-2 border-tertiary shadow-[0_2px_0_0_#286b33]">
<span class="w-3 h-3 rounded-full bg-on-tertiary-container shadow-inner block"></span>
<span class="font-label-bold text-label-bold text-on-tertiary-container uppercase">Conectado</span>
</div>
</div>
<!-- Info Note Callout -->
<div class="bg-secondary-fixed text-on-secondary-fixed p-6 rounded-lg border-2 border-secondary-fixed-dim shadow-[0_4px_0_0_#ebc23e] flex gap-4 items-start">
<span class="material-symbols-outlined text-[32px] text-secondary mt-1" data-weight="fill">info</span>
<div>
<p class="font-body-lg text-body-lg">El modo mock permite probar TalkyTown sin claves ni coste.</p>
</div>
</div>
<!-- Provider Selection Section -->
<section class="bg-surface-container p-6 rounded-xl border-2 border-surface-container-highest shadow-sm">
<h2 class="font-headline-md text-headline-md mb-stack-sm text-on-surface">Proveedor de IA</h2>
<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
<!-- Option 1: Mock -->
<label class="cursor-pointer relative block">
<input checked="" class="peer sr-only" name="ai_provider" type="radio" value="mock"/>
<div class="h-full p-4 rounded-lg border-2 border-outline-variant bg-surface-bright peer-checked:border-primary peer-checked:bg-primary-fixed peer-checked:shadow-[0_4px_0_0_#00668a] transition-all hover:bg-surface-container-low flex flex-col items-center text-center gap-2">
<span class="material-symbols-outlined text-[40px] text-primary" data-weight="fill">smart_toy</span>
<span class="font-label-bold text-label-bold">Mock provider</span>
</div>
</label>
<!-- Option 2: Cloud -->
<label class="cursor-pointer relative block">
<input class="peer sr-only" name="ai_provider" type="radio" value="cloud"/>
<div class="h-full p-4 rounded-lg border-2 border-outline-variant bg-surface-bright peer-checked:border-primary peer-checked:bg-primary-fixed peer-checked:shadow-[0_4px_0_0_#00668a] transition-all hover:bg-surface-container-low flex flex-col items-center text-center gap-2">
<span class="material-symbols-outlined text-[40px] text-on-surface-variant" data-weight="fill">cloud</span>
<span class="font-label-bold text-label-bold">Cloud OpenAI-compatible</span>
</div>
</label>
<!-- Option 3: Local -->
<label class="cursor-pointer relative block">
<input class="peer sr-only" name="ai_provider" type="radio" value="local"/>
<div class="h-full p-4 rounded-lg border-2 border-outline-variant bg-surface-bright peer-checked:border-primary peer-checked:bg-primary-fixed peer-checked:shadow-[0_4px_0_0_#00668a] transition-all hover:bg-surface-container-low flex flex-col items-center text-center gap-2">
<span class="material-symbols-outlined text-[40px] text-on-surface-variant" data-weight="fill">dns</span>
<span class="font-label-bold text-label-bold">Local OpenAI-compatible</span>
</div>
</label>
</div>
</section>
<!-- Configuration Fields Section -->
<section class="bg-surface-container p-6 rounded-xl border-2 border-surface-container-highest shadow-[0_4px_0_0_#e7e2d9]">
<h2 class="font-headline-md text-headline-md mb-stack-sm text-on-surface">Detalles de Conexión</h2>
<div class="space-y-stack-sm">
<!-- Base URL Input -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-1">Base URL</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">link</span>
</span>
<input class="w-full h-[56px] pl-12 pr-4 bg-surface-bright border-2 border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary-fixed transition-all placeholder:text-outline-variant" placeholder="http://localhost:11434/v1" type="text" value="http://localhost:11434/v1"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Model Input -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-1">Model</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">memory</span>
</span>
<input class="w-full h-[56px] pl-12 pr-4 bg-surface-bright border-2 border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary-fixed transition-all placeholder:text-outline-variant" placeholder="llama3.1" type="text" value="llama3.1"/>
</div>
</div>
<!-- API Key Input -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-1">API Key</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">key</span>
</span>
<input class="w-full h-[56px] pl-12 pr-4 bg-surface-bright border-2 border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary-fixed transition-all placeholder:text-outline-variant" placeholder="••••••••" type="password" value="sk-dummy-key"/>
</div>
</div>
</div>
</div>
<!-- Actions -->
<div class="mt-stack-md flex justify-end">
<button class="bg-primary text-on-primary font-label-bold text-label-bold uppercase px-8 py-3 rounded-full border-b-4 border-on-primary-container shadow-sm hover:brightness-110 active:border-b-0 active:translate-y-1 transition-all inline-flex items-center gap-2">
<span class="material-symbols-outlined">wifi_protected_setup</span>
                    Probar conexión
                </button>
</div>
</section>
</main>
</body></html>
