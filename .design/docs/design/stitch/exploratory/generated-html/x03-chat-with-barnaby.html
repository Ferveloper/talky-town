<script>
        // Simple chat interaction logic
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('chat-input');
            const sendBtn = document.getElementById('send-btn');
            const container = document.getElementById('chat-container');

            function addMessage(text, isUser = false) {
                if (!text.trim()) return;

                const msgDiv = document.createElement('div');
                msgDiv.className = `flex gap-4 items-end ${isUser ? 'justify-end' : ''} chat-bubble-enter`;
                
                const bubbleClass = isUser 
                    ? 'bg-primary-container p-4 rounded-t-xl rounded-bl-xl rounded-br-sm border-2 border-primary max-w-[80%] shadow-[0_4px_0_0_#004c69]'
                    : 'bg-surface-container-low p-4 rounded-t-xl rounded-br-xl rounded-bl-sm border-2 border-surface-container-highest max-w-[80%] shadow-sm';
                
                const textClass = isUser ? 'text-on-primary-container' : 'text-on-surface';

                msgDiv.innerHTML = `
                    <div class="${bubbleClass}">
                        <p class="font-body-lg text-body-lg ${textClass}">${text}</p>
                    </div>
                `;

                container.appendChild(msgDiv);
                container.scrollTop = container.scrollHeight;
                input.value = '';

                // Simulate Barnaby's response
                if (isUser) {
                    setTimeout(() => {
                        addMessage("That's wonderful! I love animals too.", false);
                    }, 1000);
                }
            }

            sendBtn.addEventListener('click', () => addMessage(input.value, true));
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addMessage(input.value, true);
            });
        });
    </script>
