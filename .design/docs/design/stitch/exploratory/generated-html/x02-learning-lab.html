<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-margin h-20 bg-surface shadow-sm border-b-4 border-surface-container-highest">

</div>
<div class="flex-grow">

<div class="h-full bg-tertiary-container w-[80%] rounded-full relative">

<div class="absolute top-0 left-0 w-full h-1/3 bg-white opacity-30 rounded-t-full"></div>
</div>
