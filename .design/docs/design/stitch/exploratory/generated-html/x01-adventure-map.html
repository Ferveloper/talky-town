<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TalkyTown - Town Map</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#e7e2d9",
                        "surface-container-low": "#f9f3ea",
                        "primary-fixed-dim": "#7ad0ff",
                        "on-background": "#1d1b16",
                        "secondary-fixed-dim": "#ebc23e",
                        "on-surface": "#1d1b16",
                        "surface-container-high": "#ede7df",
                        "outline-variant": "#bdc8d1",
                        "tertiary": "#286b33",
                        "on-primary-fixed": "#001e2c",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#002107",
                        "secondary": "#735c00",
                        "error-container": "#ffdad6",
                        "inverse-surface": "#32302a",
                        "on-primary-container": "#004e6b",
                        "surface-variant": "#e7e2d9",
                        "on-secondary-fixed-variant": "#574500",
                        "on-primary": "#ffffff",
                        "on-primary-fixed-variant": "#004c69",
                        "tertiary-container": "#82c885",
                        "surface-tint": "#00668a",
                        "tertiary-fixed-dim": "#90d792",
                        "error": "#ba1a1a",
                        "surface-dim": "#dfd9d1",
                        "secondary-container": "#fdd34d",
                        "background": "#fff9f0",
                        "surface-bright": "#fff9f0",
                        "tertiary-fixed": "#abf4ac",
                        "primary-container": "#40c4ff",
                        "inverse-primary": "#7ad0ff",
                        "on-tertiary-container": "#0a541f",
                        "secondary-fixed": "#ffe087",
                        "on-secondary-container": "#725b00",
                        "surface-container": "#f3ede4",
                        "inverse-on-surface": "#f6f0e7",
                        "on-error": "#ffffff",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#c3e8ff",
                        "on-tertiary-fixed-variant": "#07521d",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed": "#241a00",
                        "surface": "#fff9f0",
                        "on-secondary": "#ffffff",
                        "primary": "#00668a",
                        "outline": "#6e7980",
                        "on-surface-variant": "#3e484f"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "container-margin": "24px",
                        "stack-md": "24px",
                        "gutter": "16px",
                        "stack-lg": "48px",
                        "stack-sm": "12px"
                    },
                    "fontFamily": {
                        "body-lg": ["Quicksand"],
                        "display-lg-mobile": ["Quicksand"],
                        "display-lg": ["Quicksand"],
                        "body-md": ["Quicksand"],
                        "caption": ["Quicksand"],
                        "label-bold": ["Quicksand"],
                        "headline-md": ["Quicksand"]
                    },
                    "fontSize": {
                        "body-lg": ["20px", { "lineHeight": "30px", "fontWeight": "500" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "38px", "fontWeight": "700" }],
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["18px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "caption": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "label-bold": ["16px", { "lineHeight": "24px", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            padding-top: 80px; /* TopAppBar height */
            padding-bottom: 90px; /* BottomNavBar height approx */
        }
        
        .map-container {
            background-image: radial-gradient(circle at center, theme('colors.surface-container-lowest') 0%, theme('colors.surface-container-low') 100%);
        }

        .district-card {
            border: 2px solid theme('colors.outline-variant');
            box-shadow: 0 4px 0 0 theme('colors.surface-container-highest');
            transition: all 0.1s ease;
        }

        .district-card:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 0 theme('colors.surface-container-highest');
        }

        .xp-badge {
            border: 2px solid theme('colors.secondary');
        }
    </style>
</head>
<body class="min-h-screen map-container">
<!-- TopAppBar Shared Component -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-margin h-20 bg-surface border-b-4 border-surface-container-highest shadow-sm">
<div class="flex items-center gap-2">
<span class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">TalkyTown</span>
</div>
<!-- Gamification Stats (Injected here as it's the home screen context) -->
<div class="flex gap-4 items-center">
<div class="flex items-center bg-secondary-container text-on-secondary-container px-3 py-1 rounded-full xp-badge">
<span class="material-symbols-outlined mr-1" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-label-bold text-label-bold">500 XP</span>
</div>
<div class="flex items-center bg-error-container text-on-error-container px-3 py-1 rounded-full border-2 border-error">
<span class="material-symbols-outlined mr-1" data-icon="local_fire_department" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="font-label-bold text-label-bold">5</span>
</div>
<img alt="User profile avatar" class="w-10 h-10 rounded-full border-2 border-primary-container cursor-pointer hover:scale-105 transition-transform" data-alt="A small, cheerful cartoon-style avatar of a child character, designed with vibrant, modern playful colors. The image has a soft cream background and bright accents, matching a light-mode educational app aesthetic. High contrast and highly readable for young users." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAj4Gd5hT9J8iLwlHEanvyJF-6bb0kqgTJocjNOJXd8PArLjGpMB3A0VcOdcUFljY2hzKwikUGK-jKTPgDa5bdjTJZknHLkzEBZBYTGgWH6cY6e_NNxgllH_5gcTS26BYGbWTe4PqcxjCzEdSUNa5qAx_0YKiN7JtF_K-x1qEwG-hhiWXOiS6u2xa3mC7BPRyp-AK5vxh-tC26ubSWfCDJG9JzMlQ9yBLhTS7sNPBxMFTqCNQBD8i_RJ0dGslsgxLO5ktAl9VVA463p"/>
</div>
</header>
<!-- Main Content Canvas -->
<main class="max-w-4xl mx-auto px-container-margin py-stack-md flex flex-col items-center">
<div class="text-center mb-stack-md w-full">
<h1 class="font-display-lg text-display-lg text-on-surface mb-unit">Where to today?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Tap a location to start learning!</p>
</div>
<!-- Asymmetric Bento Grid for Districts -->
<div class="grid grid-cols-2 md:grid-cols-3 gap-gutter w-full max-w-3xl">
<!-- District 1 -->
<button class="district-card bg-surface-container-lowest rounded-xl p-stack-sm flex flex-col items-center justify-center hover:bg-surface-container-low group col-span-2 md:col-span-1 min-h-[160px]">
<div class="w-20 h-20 mb-3 bg-primary-container rounded-full flex items-center justify-center border-2 border-primary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-4xl text-on-primary-container" data-icon="bakery_dining">bakery_dining</span>
</div>
<span class="font-label-bold text-label-bold text-on-surface uppercase tracking-wide">The Bakery</span>
<div class="w-full bg-surface-variant h-2 mt-2 rounded-full overflow-hidden">
<div class="bg-tertiary-container h-full w-3/4"></div>
</div>
</button>
<!-- District 2 -->
<button class="district-card bg-surface-container-lowest rounded-xl p-stack-sm flex flex-col items-center justify-center hover:bg-surface-container-low group min-h-[160px]">
<div class="w-20 h-20 mb-3 bg-tertiary-container rounded-full flex items-center justify-center border-2 border-tertiary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-4xl text-on-tertiary-container" data-icon="park">park</span>
</div>
<span class="font-label-bold text-label-bold text-on-surface uppercase tracking-wide">The Park</span>
<div class="w-full bg-surface-variant h-2 mt-2 rounded-full overflow-hidden">
<div class="bg-tertiary-container h-full w-1/2"></div>
</div>
</button>
<!-- District 3 -->
<button class="district-card bg-surface-container-lowest rounded-xl p-stack-sm flex flex-col items-center justify-center hover:bg-surface-container-low group min-h-[160px]">
<div class="w-20 h-20 mb-3 bg-secondary-container rounded-full flex items-center justify-center border-2 border-secondary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-4xl text-on-secondary-container" data-icon="toys">toys</span>
</div>
<span class="font-label-bold text-label-bold text-on-surface uppercase tracking-wide">Toy Shop</span>
<div class="w-full bg-surface-variant h-2 mt-2 rounded-full overflow-hidden">
<div class="bg-tertiary-container h-full w-1/4"></div>
</div>
</button>
<!-- District 4 -->
<button class="district-card bg-surface-container-lowest rounded-xl p-stack-sm flex flex-col items-center justify-center hover:bg-surface-container-low group col-span-2 md:col-span-2 min-h-[160px]">
<div class="w-20 h-20 mb-3 bg-error-container rounded-full flex items-center justify-center border-2 border-error group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-4xl text-on-error-container" data-icon="school">school</span>
</div>
<span class="font-label-bold text-label-bold text-on-surface uppercase tracking-wide">Schoolhouse</span>
<span class="font-caption text-caption text-on-surface-variant mt-1">New lesson available!</span>
</button>
<!-- District 5 (Locked) -->
<button class="district-card bg-surface-variant rounded-xl p-stack-sm flex flex-col items-center justify-center opacity-70 cursor-not-allowed min-h-[160px]">
<div class="w-20 h-20 mb-3 bg-outline-variant rounded-full flex items-center justify-center border-2 border-outline">
<span class="material-symbols-outlined text-4xl text-outline" data-icon="lock">lock</span>
</div>
<span class="font-label-bold text-label-bold text-outline uppercase tracking-wide">Library</span>
<span class="font-caption text-caption text-outline mt-1">Unlock at Lvl 5</span>
</button>
</div>
</main>
<!-- BottomNavBar Shared Component -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe bg-surface-container-low border-t-4 border-surface-container-highest shadow-[0_-4px_0_0_rgba(0,0,0,0.05)] rounded-t-lg md:hidden">
<!-- Active Tab: Map -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-2 scale-110 shadow-[0_4px_0_0_#004c69] active:scale-95 transition-all duration-75" href="#">
<span class="material-symbols-outlined mb-1" data-icon="map" style="font-variation-settings: 'FILL' 1;">map</span>
<span class="font-label-bold text-label-bold">Map</span>
</a>
<!-- Inactive Tab: Lessons -->
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high transition-colors active:scale-95 duration-75 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" data-icon="school">school</span>
<span class="font-label-bold text-label-bold">Lessons</span>
</a>
<!-- Inactive Tab: Chat -->
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high transition-colors active:scale-95 duration-75 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" data-icon="forum">forum</span>
<span class="font-label-bold text-label-bold">Chat</span>
</a>
<!-- Inactive Tab: Progress -->
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high transition-colors active:scale-95 duration-75 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" data-icon="leaderboard">leaderboard</span>
<span class="font-label-bold text-label-bold">Progress</span>
</a>
</nav>
<!-- Desktop Navigation Cluster (Hidden on mobile) -->
<nav class="hidden md:flex fixed top-0 left-1/2 transform -translate-x-1/2 h-20 items-center gap-8 z-[51]">
<a class="text-primary font-bold hover:scale-105 transition-transform flex items-center gap-2" href="#">
<span class="material-symbols-outlined" data-icon="map" style="font-variation-settings: 'FILL' 1;">map</span>
<span class="font-label-bold text-label-bold">Map</span>
</a>
<a class="text-on-surface-variant hover:scale-105 transition-transform flex items-center gap-2" href="#">
<span class="material-symbols-outlined" data-icon="school">school</span>
<span class="font-label-bold text-label-bold">Lessons</span>
</a>
<a class="text-on-surface-variant hover:scale-105 transition-transform flex items-center gap-2" href="#">
<span class="material-symbols-outlined" data-icon="forum">forum</span>
<span class="font-label-bold text-label-bold">Chat</span>
</a>
<a class="text-on-surface-variant hover:scale-105 transition-transform flex items-center gap-2" href="#">
<span class="material-symbols-outlined" data-icon="leaderboard">leaderboard</span>
<span class="font-label-bold text-label-bold">Progress</span>
</a>
</nav>
</body></html>
