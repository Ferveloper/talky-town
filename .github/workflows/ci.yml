name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://talkytown:talkytown@localhost:5432/talkytown?schema=public
      JWT_SECRET: talkytown-ci-test-only-secret-at-least-32-characters

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: talkytown
          POSTGRES_PASSWORD: talkytown
          POSTGRES_DB: talkytown
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talkytown -d talkytown"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply existing migrations and seed
        run: |
          pnpm db:validate
          pnpm db:migrate
          pnpm db:seed
          pnpm db:verify

      - name: Test
        run: pnpm test

      - name: PostgreSQL integration tests
        run: pnpm test:db

      - name: Build
        run: pnpm build

  browser:
    name: Browser acceptance (Node 20 / Linux)
    runs-on: ubuntu-latest
    needs: validate
    env:
      E2E_DATABASE_URL: postgresql://talkytown:talkytown@localhost:5432/talkytown_e2e?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: talkytown
          POSTGRES_PASSWORD: talkytown
          POSTGRES_DB: talkytown_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talkytown -d talkytown_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Fictional-fixture browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
