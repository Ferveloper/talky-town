services:
  postgres:
    image: postgres:16-alpine
    container_name: talkytown-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: talkytown
      POSTGRES_PASSWORD: talkytown
      POSTGRES_DB: talkytown
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - talkytown_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U talkytown -d talkytown"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  talkytown_postgres_data:
